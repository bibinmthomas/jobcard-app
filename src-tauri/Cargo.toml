[package]
name = "jobcard-app"
version = "1.0.1"
description = "Job Card Generator Application"
authors = ["bibinmthomas"]
edition = "2021"

[lib]
name = "jobcard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jobcard-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
